name: I maintain this package (review its benchmark)
description: Confirm that the benchmark uses your package correctly, or say what must change. A confirmed benchmark gets a blue check.
title: "Maintainer review: "
labels: ["review", "maintainer"]
body:
  - type: markdown
    attributes:
      value: |
        A blue check on a benchmark means that a maintainer of the package read its adapter and agrees that it uses the package correctly. Please read the adapter first: the Source link under a label shows it.

        Open this issue from an account that the package's repository or registry page shows as a maintainer, or tell us below how we can confirm it.
  - type: input
    id: package
    attributes:
      label: Package
      description: The registry and the name, as in the address of its page. For example npm/elysia.
    validations:
      required: true
  - type: input
    id: task
    attributes:
      label: Task
      description: The task, as in the address of its page. For example http-server/json-api. Leave empty if it is about every task.
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page you were on.
  - type: dropdown
    id: verdict
    attributes:
      label: Your verdict
      options:
        - The benchmark is correct as it is
        - It is correct after the changes below
        - It is not correct
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: Changes that it needs
      description: Leave empty if it is correct as it is. Code is welcome.
      render: text
  - type: textarea
    id: proof
    attributes:
      label: How we can confirm that you maintain it
      description: For example a link to your commits in its repository, or your profile on its registry page.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I read the adapter and the scenario of the task.
          required: true
        - label: I maintain this package, or I speak for its maintainers.
          required: true
