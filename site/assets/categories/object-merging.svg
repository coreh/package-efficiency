<style>.o{stroke:#1c1c1c;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.n{fill:none}.a{fill:#fbfbfb}.b{fill:#dedede}.c{fill:#b5b5b5}.d{fill:#7d7d7d}.t{stroke:#1c1c1c;stroke-width:2;stroke-linecap:round;fill:none}.so{stroke:#1c1c1c}.sb{stroke:#dedede}.sa{stroke:#fbfbfb}@media (prefers-color-scheme:dark){.o,.t,.so{stroke:#fff}.a{fill:#848484}.b{fill:#4a4a4a}.c{fill:#242424}.d{fill:#000}.sb{stroke:#4a4a4a}.sa{stroke:#848484}}</style>
<rect class="o n" style="stroke-width:4" x="11" y="15" width="44" height="44"/><circle class="o n" style="stroke-width:4" cx="59" cy="59" r="24"/>
<rect class="b" x="11" y="15" width="44" height="44"/><circle class="b" cx="59" cy="59" r="24"/>
