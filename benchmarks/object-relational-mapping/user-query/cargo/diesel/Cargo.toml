[package]
name = "object-relational-mapping-diesel"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bench-harness = { path = "../../../../../harness/rust", features = ["operations"] }
diesel = { version = "2", default-features = false, features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
serde_json = "1"
