[package]
name = "http-client-get-json-hyper"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bench-harness = { path = "../../../../../harness/rust", features = ["client-tokio"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
