[package]
name = "web-application-frameworks-loco-rs"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bench-harness = { path = "../../../../../harness/rust" }
loco-rs = { version = "1.2", default-features = false, features = ["cli"] }
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
